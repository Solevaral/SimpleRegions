name: release

# Builds the plugin and attaches SimpleRegions.dll to the release.
# Triggered by pushing a tag like v1.0.0, or manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build SimpleRegions/SimpleRegions.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleRegions
          path: SimpleRegions/bin/Release/SimpleRegions.dll

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SimpleRegions/bin/Release/SimpleRegions.dll
